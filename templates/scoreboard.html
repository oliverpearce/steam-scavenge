{% extends "base.html" %}

{% block title %}Scoreboard · {{ config.GAME_TITLE }}{% endblock %}

{% block body %}
<div class="scoreboard-bg min-h-screen px-4 py-10 md:px-10">
  <header class="mb-6 text-center">
    <p class="text-sm font-semibold uppercase tracking-[0.35em] text-primary">Live standings</p>
    <h1 class="mt-2 font-display text-5xl font-extrabold tracking-tight md:text-7xl">{{ config.GAME_TITLE }}</h1>
  </header>

  <div id="leaderboard-wrap"
       hx-get="/partials/leaderboard" hx-trigger="every 2s"
       hx-vals="js:{v: leaderboardVersion()}"
       hx-target="this" hx-swap="innerHTML">
    {% include "partials/leaderboard.html" %}
  </div>
</div>
{% endblock %}
